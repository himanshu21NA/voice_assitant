# render.yaml for deploying FastAPI backend on Render
services:
  - type: web
    name: voice-assistant-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
    autoDeploy: true
    rootDir: backend

  - type: cron
    name: scraper-cron
    env: docker
    schedule: "*/15 * * * *"
    command: |
      curl -X POST https://backend.onrender.com/cron/run-scraper